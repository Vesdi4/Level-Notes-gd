name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: stable
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Get version from mod.json
        id: version
        run: |
          VERSION=$(cat mod.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Copy geode file
        run: |
          GEODE_FILE=$(find /home/runner/work/_actions/geode-sdk/build-geode-mod/main/combine/artifacts -name "*.geode" -type f | head -1)
          echo "Found: $GEODE_FILE"
          cp "$GEODE_FILE" ./mod.geode

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ./mod.geode

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./mod.geode
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}