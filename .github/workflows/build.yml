name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - name: Find and copy geode file
        run: |
          GEODE_FILE=$(find /home/runner/work/_actions/geode-sdk/build-geode-mod/main/combine/artifacts -name "*.geode" -type f | head -1)
          echo "Found: $GEODE_FILE"
          cp "$GEODE_FILE" ./mod.geode

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: ./mod.geode

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./mod.geode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}